# configs/eastern_shore_airports.yaml
#
# BirdStrikeNet's Eastern Shore of Maryland airport roster: the nine
# counties are Cecil, Kent, Queen Anne's, Talbot, Caroline, Dorchester,
# Wicomico, Somerset, Worcester. Built from the `airports` table
# (data/birdstrikegeo.db, sourced from OurAirports) filtered to
# iso_region = 'US-MD', excluding heliports/closed fields, then assigned
# to a county by municipality name (OurAirports has no county column)
# and cross-checked against longitude to drop Western Shore/Southern MD/
# Western MD fields that share a border town name. Edit this file
# directly to add/remove/re-tag an airport -- the dashboard reads
# whatever is here, not a hardcoded list in code.
#
# `towered`: verified via live web search (AirNav/AOPA/FAA sources) for
# SBY, OXB, and ESN only -- see the citations below. Every other field
# on this list is a small private/county strip with no published
# control tower; marked `towered: false` by inference (no contract-
# tower listing found for any of them), not individually re-verified
# one by one. Flip any of these if you know otherwise.
#
# `faa_lid`: the AIRPORT_ID value actually used in the FAA Wildlife
# Strike Database for this field (confirmed against real strike rows
# where any exist, e.g. KESN/KSBY/KOXB/KCGE/W29/3W3) -- FAA sometimes
# drops the "K" ICAO prefix for small fields (e.g. "W29", "MD1") even
# though OurAirports' `ident` keeps a "K"-prefixed or bare form
# inconsistently. Verify a new entry's faa_lid against real strike data
# before trusting it blindly, the same way DATABASE.md's worked example
# teaches for any other species/airport join in this project.

counties:
  - Cecil
  - Kent
  - "Queen Anne's"
  - Talbot
  - Caroline
  - Dorchester
  - Wicomico
  - Somerset
  - Worcester

