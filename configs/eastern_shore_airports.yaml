#     alone; add it to Cecil above if you confirm it's east of the
#     Susquehanna.
#   - Every Harford/Baltimore/Anne Arundel/Calvert/St Mary's/Charles/
#     Prince George's/Montgomery/Frederick/Carroll/Washington/
#     Allegany/Garrett County field that showed up in the same
#     longitude-sorted MD airport query (e.g. KBWI, KADW, KANP, KGAI,
#     KFDK, KHGR, K2G4) -- all genuinely Western Shore or farther west,
#     not Eastern Shore.

